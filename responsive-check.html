<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio responsive QA</title><style>body{font:14px Arial;margin:0;background:#d9e1ec;color:#11243a}header{position:sticky;top:0;padding:12px 18px;background:#f8faff;z-index:100;border-bottom:1px solid #8996aa;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:9px 12px}main{padding:18px;overflow:auto}iframe{display:block;border:0;box-shadow:0 0 0 1px #607089}pre{max-height:180px;overflow:auto;white-space:pre-wrap;font:12px monospace;background:white;padding:12px;margin:0}#frame-status{font-weight:bold}</style></head><body><header><label>Viewport <select id="viewport" aria-label="Viewport size"><option value="320,740">320 × 740 - narrow phone</option><option value="360,800">360 × 800 - phone</option><option value="390,844">390 × 844 - phone</option><option value="480,720">480 × 720 - small window</option><option value="600,800">600 × 800 - narrow tablet</option><option value="667,375">667 × 375 - landscape phone</option><option value="768,1024">768 × 1024 - portrait tablet</option><option value="820,1180">820 × 1180 - tablet</option><option value="1024,768">1024 × 768 - landscape tablet</option><option value="1280,800">1280 × 800 - desktop</option><option value="1440,900">1440 × 900 - desktop</option><option value="1920,1080">1920 × 1080 - wide desktop</option></select></label><button id="scan" disabled>Audit current view</button><button id="spacing">Toggle WCAG text spacing</button><span id="frame-status" role="status">Loading public portfolio...</span></header><pre id="audit-output" role="status" aria-live="polite"></pre><main><iframe id="audit-frame" src="./?qa=responsive-a11y-18" title="Public portfolio viewport"></iframe></main><script>
const frame=document.getElementById('audit-frame');const scan=document.getElementById('scan');
function resize(){const[w,h]=document.getElementById('viewport').value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';document.getElementById('frame-status').textContent=w+' × '+h;}
document.getElementById('viewport').addEventListener('change',resize);resize();
frame.addEventListener('load',()=>{const script=frame.contentDocument.createElement('script');script.src='assets/audit/axe.min.js';script.onload=()=>{scan.disabled=false;document.getElementById('frame-status').textContent+=' - audit ready';};frame.contentDocument.head.append(script);});
scan.addEventListener('click',async()=>{const out=document.getElementById('audit-output');out.textContent='Scanning...';try{const result=await frame.contentWindow.axe.run(frame.contentDocument,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa','best-practice']}});const doc=frame.contentDocument;out.textContent=JSON.stringify({width:frame.contentWindow.innerWidth,height:frame.contentWindow.innerHeight,panel:doc.querySelector('.category-panel:not([hidden])')?.id||'landing',horizontalOverflow:doc.documentElement.scrollWidth>doc.documentElement.clientWidth,violations:result.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),incomplete:result.incomplete.map(v=>({id:v.id,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary,checks:n.any.concat(n.all,n.none).map(c=>({id:c.id,message:c.message,data:c.data}))}))})),passes:result.passes.length},null,2);}catch(e){out.textContent=String(e);}});
document.getElementById('spacing').addEventListener('click',()=>{const doc=frame.contentDocument;let style=doc.getElementById('wcag-spacing-test');if(style)style.remove();else{style=doc.createElement('style');style.id='wcag-spacing-test';style.textContent='body *{line-height:1.5!important;letter-spacing:.12em!important;word-spacing:.16em!important}p{margin-bottom:2em!important}';doc.head.append(style);}});
</script></body></html>
